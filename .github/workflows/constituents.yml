name: Index constituents (dashboard heatmap)

# Weekly refresh of index constituents from niftyindices.com into data/constituents.json.
on:
  schedule:
    - cron: '30 2 * * 0'     # Sunday 08:00 IST (constituents + weights)
    - cron: '30 3 * * 1-5'   # 09:00 IST weekdays (weights refresh)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: constituents
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Collect
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python pipeline/constituents.py; fi
          python pipeline/weights.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data && [ -z "$(git status --porcelain data)" ]; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: constituents+weights $(date -u +%F)"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0; sleep $((i*5)); done
          exit 1
