name: Auto reports (primary builder, no Claude needed)

# Builds each report shortly BEFORE its due time (IST), then retries twice. A run whose report
# is already in reports/<id>/index.json for today does nothing, so retries are free.
# Off-the-hour minutes are used because GitHub delays jobs queued at :00 / :30.
on:
  schedule:
    - cron: '13 2 * * 1-5'    # 07:43 IST  premarket-news            (due 08:00)
    - cron: '28 2 * * 1-5'    # 07:58 IST  premarket-news retry
    - cron: '43 2 * * 1-5'    # 08:13 IST  morning-brief, morning-detailed (due 08:30) + premarket retry
    - cron: '58 2 * * 1-5'    # 08:28 IST  morning-pulse (due 08:45) + brief/detailed retry
    - cron: '13 3 * * 1-5'    # 08:43 IST  final retry, all morning reports
    - cron: '13 12 * * 1-5'   # 17:43 IST  evening-market-wrap        (due 18:00)
    - cron: '43 12 * * 1-5'   # 18:13 IST  evening-market-wrap retry
    - cron: '13 13 * * 1-5'   # 18:43 IST  evening-news-wrap (due 19:00) + market-wrap retry
    - cron: '43 13 * * 1-5'   # 19:13 IST  evening-news-wrap retry
  push:
    paths: ['.pulse/last.txt']   # heartbeat from an external scheduler: GitHub's own cron is often late or skipped
  workflow_dispatch:
    inputs:
      ids:
        description: 'Space-separated schedule ids (e.g. "evening-market-wrap")'
        required: true
      force:
        description: 'Rebuild even if already published today'
        type: boolean
        default: false
      dry:
        description: 'Dry run: real data, no publish, PDFs attached to the run'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-reports
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pick report ids
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "13 2 * * 1-5")  IDS="premarket-news" ;;
            "28 2 * * 1-5")  IDS="premarket-news" ;;
            "43 2 * * 1-5")  IDS="premarket-news morning-brief morning-detailed" ;;
            "58 2 * * 1-5")  IDS="morning-pulse morning-brief morning-detailed" ;;
            "13 3 * * 1-5")  IDS="premarket-news morning-brief morning-detailed morning-pulse" ;;
            "13 12 * * 1-5") IDS="evening-market-wrap" ;;
            "43 12 * * 1-5") IDS="evening-market-wrap" ;;
            "13 13 * * 1-5") IDS="evening-news-wrap evening-market-wrap" ;;
            "43 13 * * 1-5") IDS="evening-news-wrap" ;;
            *) IDS="${{ github.event.inputs.ids }}" ;;
          esac
          if [ "${{ github.event_name }}" = "push" ]; then
            # heartbeat: build whatever is due for this time of day (IST); finished reports are skipped below
            H=$(TZ=Asia/Kolkata date +%H)
            if [ "$H" -lt 12 ]; then IDS="premarket-news morning-brief morning-detailed morning-pulse"; else IDS="evening-market-wrap evening-news-wrap"; fi
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            # drop reports already published (or marked holiday) today, so retries finish in seconds
            IDS=$(python3 - $IDS <<'PY'
          import json, sys, datetime as dt
          today = (dt.datetime.now(dt.timezone.utc) + dt.timedelta(hours=5, minutes=30)).date().isoformat()
          left = []
          for i in sys.argv[1:]:
              try:
                  runs = json.load(open("reports/%s/index.json" % i)).get("runs", [])
              except Exception:
                  runs = []
              if not any(r.get("date") == today and r.get("status") in ("ok", "holiday") for r in runs):
                  left.append(i)
          print(" ".join(left))
          PY
          )
          fi
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "To build: ${IDS:-nothing (all done)}"
      - name: Install renderer
        if: ${{ steps.pick.outputs.ids != '' }}
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Build and publish
        if: ${{ steps.pick.outputs.ids != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ github.event.inputs.force }}
          DRY: ${{ github.event.inputs.dry }}
        run: |
          for id in ${{ steps.pick.outputs.ids }}; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            if [ "$FORCE" = "true" ]; then F="--force"; else F=""; fi
            if [ "$DRY" = "true" ]; then F="$F --dry --out /tmp/dry"; fi
            if [ "$DRY" = "true" ]; then
              python pipeline/auto_reports.py "$id" $F
            else
              python pipeline/auto_reports.py "$id" $F || echo "::warning::$id failed"
            fi
          done
      - name: Attach dry-run PDFs
        if: ${{ github.event.inputs.dry == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: dry-run-reports
          path: /tmp/dry/*.pdf
