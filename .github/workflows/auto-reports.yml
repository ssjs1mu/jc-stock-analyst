name: Auto reports (primary builder, free, no Claude / no paid API)

# Self-healing: runs every 15 minutes through the IST morning and evening windows. Each run builds
# whatever is DUE by the current IST time and not yet published today, so a skipped or late GitHub
# cron is simply caught by the next one. Finished reports are skipped in seconds. Commentary is
# rule-based (no Gemini/Anthropic key needed); an optional LLM can be enabled with USE_LLM=1.
on:
  schedule:
    - cron: '7,22,37,52 2-4 * * 1-5'     # 07:37-10:22 IST every 15 min
    - cron: '7,22,37,52 10-11 * * 1-5'   # 16:07-17:22 IST every 15 min (Evening Breeze by 4:30 PM)
    - cron: '7,22,37,52 12-14 * * 1-5'   # 17:37-20:22 IST every 15 min
  push:
    paths: ['.pulse/last.txt']   # heartbeat from an external scheduler: GitHub's own cron is often late or skipped
  workflow_dispatch:
    inputs:
      ids:
        description: 'Space-separated schedule ids (e.g. "evening-market-wrap")'
        required: true
      force:
        description: 'Rebuild even if already published today'
        type: boolean
        default: false
      dry:
        description: 'Dry run: real data, no publish, PDFs attached to the run'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-reports
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pick report ids
        id: pick
        run: |
          IDS="${{ github.event.inputs.ids }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            IDS=$(python3 - <<'PY'
          import json, datetime as dt
          ist = dt.datetime.now(dt.timezone.utc) + dt.timedelta(hours=5, minutes=30)
          today, hm = ist.date().isoformat(), ist.hour * 60 + ist.minute
          # (id, due-from minute of IST day, stop-after minute)
          plan = [("premarket-news", 7*60+40, 15*60), ("morning-brief", 8*60+10, 15*60), ("morning-detailed", 8*60+10, 15*60),
                  ("morning-pulse", 8*60+10, 15*60), ("evening-breeze", 16*60+5, 23*60+59), ("evening-market-wrap", 17*60+40, 23*60+59), ("evening-news-wrap", 18*60+40, 23*60+59)]
          left = []
          for i, lo, hi in plan:
              if ist.weekday() > 4 or not (lo <= hm <= hi):
                  continue
              try:
                  runs = json.load(open("reports/%s/index.json" % i)).get("runs", [])
              except Exception:
                  runs = []
              if not any(r.get("date") == today and r.get("status") in ("ok", "holiday") for r in runs):
                  left.append(i)
          print(" ".join(left))
          PY
          )
          fi
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "To build: ${IDS:-nothing (all done or not yet due)}"
      - name: Install renderer
        if: ${{ steps.pick.outputs.ids != '' }}
        run: |
          pip install playwright pillow pypdf
          python -m playwright install --with-deps chromium
      - name: Build and publish
        if: ${{ steps.pick.outputs.ids != '' }}
        env:
          FORCE: ${{ github.event.inputs.force }}
          DRY: ${{ github.event.inputs.dry }}
        run: |
          for id in ${{ steps.pick.outputs.ids }}; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            if [ "$FORCE" = "true" ]; then F="--force"; else F=""; fi
            if [ "$DRY" = "true" ]; then F="$F --dry --out /tmp/dry"; fi
            if [ "$DRY" = "true" ]; then
              python pipeline/auto_reports.py "$id" $F
            else
              python pipeline/auto_reports.py "$id" $F || echo "::warning::$id failed"
            fi
          done
      - name: Push dry-run previews to the preview branch
        if: ${{ github.event.inputs.dry == 'true' }}
        run: |
          mkdir -p /tmp/pv && cp /tmp/dry/*.png /tmp/pv/ 2>/dev/null || true
          cd /tmp/pv && git init -q && git checkout -q -b preview && git add -A && \
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm preview || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview
      - name: Attach dry-run PDFs
        if: ${{ github.event.inputs.dry == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: dry-run-reports
          path: |
            /tmp/dry/*.pdf
            /tmp/dry/*.png
