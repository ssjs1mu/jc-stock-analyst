name: F&O open-interest walls (terminal)
# data/fno_oi.json: per-stock call / put max-OI strikes (range + support/resistance). Source updates after the close; refreshed before the open and in the evening.
on:
  schedule:
    - cron: '40 2 * * 1-5'    # 08:10 IST
    - cron: '30 14 * * 1-5'   # 20:00 IST
  workflow_dispatch:
  push:
    paths: ['pipeline/fno_oi.py', '.github/workflows/fno-oi.yml']
permissions:
  contents: write
concurrency:
  group: fno-oi
  cancel-in-progress: false
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python pipeline/fno_oi.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fno_oi.json; git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "data: F&O OI $(date -u +%F)"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0; sleep $((i*5)); done; exit 1
