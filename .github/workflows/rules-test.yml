name: Test your rules (Rules tab of the master sheet)

# Replays the day-call engine on the last ~60 sessions of 5-minute candles with and without each row of the Rules tab,
# and publishes data/rules_test.csv, which the sheet's "Rule Tests" tab shows. Runs every weekday evening; can also be run by hand.
on:
  schedule:
    - cron: '50 11 * * 1-5'   # 17:20 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rules-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test rules
        run: node pipeline/rules_test.js
      - name: Publish
        run: |
          git config user.name "jc-rules-bot"
          git config user.email "jc-rules-bot@users.noreply.github.com"
          git add data/rules_test.csv data/rules.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "rules: test results $(TZ=Asia/Kolkata date '+%F %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
