name: Projection preview (real data, nothing published)
on:
  workflow_dispatch:
    inputs:
      syms: { description: 'Symbols', default: 'BEL RELIANCE' }
      live: { description: 'live cut-off (true/false)', default: 'false' }
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - run: node pipeline/proj_preview.js "${{ github.event.inputs.syms }}" "${{ github.event.inputs.live }}"
      - run: |
          pip install playwright && python -m playwright install --with-deps chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page(viewport={'width':1040,'height':900}); pg.goto('file:///tmp/proj.html'); pg.screenshot(path='/tmp/pv/proj.png', full_page=True) if __import__('os').makedirs('/tmp/pv', exist_ok=True) is None else None
          PY
          cd /tmp/pv && git init -q && git checkout -q -b preview && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm proj && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview
