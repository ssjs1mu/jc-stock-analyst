name: FII/DII data (dashboard)

# Collects FII/DII cash flows into data/fiidii.json (free sources: NSE, Moneycontrol, NSDL).
# NSE posts provisional figures around 5-7 PM IST; NSDL posts monthly FPI figures the next morning.
on:
  schedule:
    - cron: '17 13 * * 1-5'   # 18:47 IST
    - cron: '47 14 * * 1-5'   # 20:17 IST (catch late NSE posting)
    - cron: '17 4 * * 1-5'    # 09:47 IST (NSDL update)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fiidii
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Collect
        run: python pipeline/fiidii.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/fiidii.json && git ls-files --error-unmatch data/fiidii.json >/dev/null 2>&1; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fiidii.json
          git commit -m "data: FII/DII $(date -u +%F)"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0; sleep $((i*5)); done
          exit 1
